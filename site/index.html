<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<title>Twelfth Space Portal</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#24282C">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout recreated from the Payflow dashboard reference: dark docked sidebar with a nav card, off-white rounded canvas, white cards with hairline borders, dark gradient balance card, dot status pills, sand and grey bar charts. No shadows. One colour scheme, all colours are tokens below so the brand palette can be swapped in later. */
:root{
  --side:#24282C;--side-2:#24282C;--canvas:#F3F3E7;--card:#fff;--line:rgba(62,70,49,.13);--line-2:rgba(62,70,49,.08);
  --ink:#24282C;--muted:#6a7360;--dark:#3E4631;--dark-2:#24282C;
  --sand:#FAFF7E;--sand-2:#FEFFDA;--grey-1:#C2CBAF;--grey-2:#D2E3C0;
  --ok:#4f8a3a;--warn:#e29a1d;--bad:#d9503f;--info:#4a74d4;
  --up-bg:#e5f5d9;--up:#3c7a1d;--dn-bg:#fde7e4;--dn:#c0392b;
  --f:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{overflow-x:clip;background:var(--side-2)}
body{margin:0;min-height:100vh;background:var(--side-2);color:var(--ink);font:14px/1.45 var(--f);-webkit-font-smoothing:antialiased;overflow-x:clip}
h1,h2,h3,p,ul{margin:0}ul{padding:0;list-style:none}
a{color:inherit;text-decoration:none}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,select,textarea{font-family:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.side :focus-visible{outline-color:#f3f1ee}
.ic{flex:none;display:block}
.muted{color:var(--muted)}.small{font-size:13px}.num{font-variant-numeric:tabular-nums}
.grow{flex:1}.rel{position:relative}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.sub{font-size:12.5px;color:var(--muted);font-weight:400}

/* ---- shell ---- */
.app{display:flex;align-items:flex-start;min-height:100vh;max-width:1760px;margin:0 auto}
.side{position:sticky;top:0;height:100vh;height:100dvh;width:262px;flex:none;display:flex;flex-direction:column;gap:12px;padding:16px 14px 14px;color:#f3f1ee;z-index:60;background:var(--side-2)}
.brand{display:flex;align-items:center;justify-content:space-between;padding:4px 6px;flex:none}
.logo-full{height:30px;width:auto;display:block}
.brand .close{display:none}
.navcard{flex:0 1 auto;min-height:0;overflow-y:auto;background:rgba(253,253,239,.07);border-radius:22px;padding:8px;display:flex;flex-direction:column;gap:2px;scrollbar-width:none}
.navcard::-webkit-scrollbar{display:none}
.ni{display:flex;align-items:center;gap:12px;min-height:38px;padding:0 12px 0 5px;border-radius:18px;color:#d2d8c6;font-weight:500;font-size:14px;transition:background .15s,color .15s;flex:none}
.ni .ico{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.08);display:grid;place-items:center;flex:none}
.ni:hover{background:rgba(253,253,239,.07);color:#fff}
.ni.on{background:linear-gradient(90deg,#5d6a48,#3E4631);color:#fff}
.ni.on .ico{background:rgba(255,255,255,.18)}
.cnt{margin-left:auto;background:var(--sand);color:#24282C;border-radius:10px;min-width:20px;height:20px;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 6px}
.switch{border:1.5px dashed rgba(255,255,255,.16);border-radius:18px;padding:10px;flex:none}
.switch .cap{display:block;font-size:11px;color:#a3ab95;margin:0 0 6px 4px}
.seg{display:flex;gap:4px;background:rgba(253,253,239,.07);border-radius:12px;padding:3px}
.seg a{flex:1;text-align:center;padding:7px 6px;border-radius:9px;color:#d2d8c6;font-weight:500;font-size:13px}
.seg a.on{background:#FDFDEF;color:#24282C}
.side .spacer{flex:1;min-height:0}
.prof{background:#fff;color:var(--ink);border-radius:22px;padding:14px;display:flex;flex-wrap:wrap;gap:10px 12px;align-items:center;flex:none}
.ring{--p:40;width:44px;height:44px;border-radius:50%;background:conic-gradient(var(--dark) calc(var(--p)*1%),#dfe2d0 0);display:grid;place-items:center;position:relative;flex:none;font-size:11px;font-weight:600}
.ring::before{content:"";position:absolute;inset:4px;border-radius:50%;background:#fff}
.ring span{position:relative}
.ptx{flex:1;min-width:0}.ptx b{display:block;font-size:14px}.ptx p{margin-top:2px;font-size:12px;color:var(--muted);line-height:1.35}
.urow{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 8px;background:linear-gradient(90deg,#3E4631,#2c3128);border-radius:20px;flex:none}
.uav{width:42px;height:42px;border-radius:50%;background:var(--sand);color:#24282C;display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.uinfo{flex:1;min-width:0}.uinfo b{display:block;font-size:14px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.uinfo small{display:block;font-size:12px;color:#a3ab95;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.canvas{flex:1;min-width:0;margin:10px 10px 10px 0;border-radius:28px;background:var(--canvas);padding:20px 22px 48px;min-height:calc(100vh - 20px);position:relative}
.top{display:flex;align-items:center;gap:10px;margin-bottom:18px;position:relative}
.top .menu{display:none}
.ibtn{width:42px;height:42px;border-radius:50%;background:#fff;border:1px solid var(--line);display:grid;place-items:center;color:var(--ink);position:relative;flex:none;transition:background .15s}
.ibtn:hover{background:#F8F8EE}
.ibtn.act{background:var(--dark);color:#fff;border-color:var(--dark)}
.ibtn.dk{background:transparent;border:0;color:#d2d8c6}.ibtn.dk:hover{background:rgba(255,255,255,.08);color:#fff}
.ibtn .rd,.avb .rd{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--bad);border:2px solid #fff;box-sizing:content-box;margin:-2px -2px 0 0}
.avb .rd{top:2px;right:2px}
.gsearch{position:relative;flex:1;max-width:420px;min-width:0}
.gsearch label{display:flex;align-items:center;gap:10px;height:42px;border-radius:999px;background:#fff;border:1px solid var(--line);padding:0 8px 0 14px;color:var(--muted)}
.gsearch input{border:0;outline:0;background:transparent;flex:1;min-width:0;font:500 14px var(--f);color:var(--ink)}
.gsearch input::placeholder{color:var(--muted)}
kbd{font:600 12px var(--f);color:var(--muted);background:var(--canvas);border-radius:9px;padding:5px 9px}
.sres,.pop{position:absolute;top:50px;background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:18px;padding:8px;z-index:70;display:none}
.sres{left:0;right:0;min-width:min(320px,calc(100vw - 32px))}
.pop{right:0;width:min(330px,calc(100vw - 32px))}
.sres.open,.pop.open{display:block}
.sres a{display:block;padding:9px 10px;border-radius:12px}
.sres a:hover,.pop a:hover{background:var(--canvas)}
.sres b{display:block;font-weight:600;font-size:14px}.sres small{display:block;color:var(--muted);font-size:12px}
.pop h3{font-size:14px;padding:6px 10px 8px}
.pop a{display:block;padding:10px;border-radius:12px;font-weight:500;font-size:14px}
.pop a.new{font-weight:700}
.ptitle{font-size:24px;font-weight:600;letter-spacing:-.02em;margin:2px 0 16px;overflow-wrap:anywhere}
.pha{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:0 0 16px}

/* ---- cards ---- */
.stack{display:flex;flex-direction:column;gap:16px}
.row2{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:16px}
.card,.glass{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;min-width:0;color:var(--ink)}
.card h2,.glass h2{font-size:16px;font-weight:600;margin:0 0 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card h2 .more{margin-left:auto;font-size:12px;font-weight:600;color:var(--muted)}
.stat .lab{font-size:13px;font-weight:500;color:var(--muted)}
.big{font-size:clamp(22px,2.4vw,28px);font-weight:600;margin-top:8px;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap}
.big small{font-size:.5em;font-weight:600;color:var(--muted);margin-right:5px}
.stat .foot{margin-top:6px;font-size:12px;color:var(--muted)}

/* dashboard grid */
.dgrid{display:grid;grid-template-columns:minmax(0,280px) minmax(0,1fr) minmax(0,270px);gap:16px;align-items:start}
.dgrid>.mid{order:0}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.bal{background:linear-gradient(165deg,#4d583c 0,#24282C 75%);border:0;border-radius:24px;padding:14px 6px 6px;color:#fff}
.bal .bh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:0 12px 14px}
.bal h2{font-size:16px;margin:0;color:#fff;display:block}
.bal small{display:block;color:#c9d0bc;font-size:12px;font-weight:400;margin-top:2px}
.curp{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.14);border-radius:14px;padding:8px 10px;font-weight:600;font-size:13px;color:#fff;flex:none}
.flag{width:18px;height:18px;border-radius:50%;background:linear-gradient(180deg,#ce1126 0 33%,#fcd116 33% 66%,#006b3f 66%);display:block}
.inner{background:#fff;color:var(--ink);border-radius:18px;padding:14px 16px 0;overflow:hidden}
.inner .lab{font-size:12.5px;color:var(--muted);font-weight:500}
.amt{font-size:clamp(24px,7vw,30px);font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap;margin-top:2px}
.amt .cur{font-size:.55em;font-weight:500;color:var(--muted);margin-right:2px;letter-spacing:0}
.amt .dec{color:#a9b09b}
.cells{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);margin:14px -16px 0}
.cells>*{display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;font-weight:500;font-size:13.5px;padding:0 8px;text-align:center}
.cells>*+*{border-left:1px solid var(--line)}
.cells>*:hover{background:#F8F8EE}
.ch{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}
.ch h2{margin:0;font-size:15px;font-weight:600}
.ch .sub{margin-top:2px}
.mini-link{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--muted);flex:none}
.mini-link:hover{background:var(--canvas);color:var(--ink)}
.avs{display:flex;gap:10px;flex-wrap:wrap}
.avb{position:relative;border-radius:50%;display:block}
.avb .av{width:44px;height:44px;font-size:14px}
.avb:hover .av{outline:2px solid var(--dark);outline-offset:2px}
.ctb{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.ctb .btn{width:100%;padding:0 10px}
.dashbtn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;border:1.5px dashed #cdd2bf;border-radius:16px;color:var(--muted);font-weight:500;width:100%;text-align:center;padding:0 12px}
.dashbtn:hover{background:#fff;color:var(--ink)}

/* transactions */
.txc{padding:0}
.tt{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:20px 20px 14px}
.tt h2{margin:0 0 2px;font-size:16px}
.tt p{font-size:12.5px;color:var(--muted)}
.tools{display:flex;gap:8px}
.fchip{margin:0 20px 12px;display:inline-flex;align-items:center;gap:8px;background:var(--canvas);border-radius:999px;padding:5px 6px 5px 12px;font-size:12.5px;font-weight:500}
.fchip button{width:20px;height:20px;border-radius:50%;background:#fff;font-size:14px;line-height:1}
.trow{display:grid;grid-template-columns:minmax(0,1fr) 62px 96px 112px 34px;gap:10px;align-items:center;padding:12px 20px;border-top:1px solid var(--line-2);position:relative;font-size:13px}
.trow.hd{background:#F8F8EE;color:var(--muted);font-size:12px;padding:10px 20px;border-top:1px solid var(--line)}
.tn{display:flex;align-items:center;gap:10px;min-width:0}
.tn .av{width:34px;height:34px;font-size:11.5px}
.tn div{min-width:0}.tn b{display:block;font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tn small{display:block;color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.td{color:var(--muted);font-size:12.5px;white-space:nowrap}
.ta{font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.ta.dim{color:var(--muted);text-decoration:line-through}
.tm{position:relative;justify-self:end}
.dots{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.dots:hover{background:var(--canvas);color:var(--ink)}
.rmenu{position:absolute;right:0;top:34px;min-width:176px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:6px;z-index:40}
.rmenu>*{display:block;width:100%;text-align:left;padding:9px 12px;border-radius:9px;font-size:13px;font-weight:500;white-space:nowrap}
.rmenu>*:hover{background:var(--canvas)}
.rmenu>.on{font-weight:700}
.fm{right:0;top:48px}
.vall{display:flex;justify-content:center;padding:16px 20px 20px;border-top:1px solid var(--line-2)}
.pad{padding:22px 20px}

/* charts */
.cc{min-width:0}
.duo{padding:0}
.duo .cc{padding:18px 20px 16px}
.duo .cc+.cc{border-top:1px solid var(--line)}
.cc .ch{margin-bottom:4px}.cc .ch h2{font-weight:500;font-size:14px}
.cn{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cn b{font-size:21px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.dl{font-size:11px;font-weight:600;border-radius:8px;padding:3px 7px;white-space:nowrap}
.dl.up{background:var(--up-bg);color:var(--up)}.dl.dn{background:var(--dn-bg);color:var(--dn)}.dl.nw{background:var(--canvas);color:var(--muted)}
.bchart{display:flex;gap:6px;margin-top:34px}
.bcol{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:8px}
.bt{position:relative;height:92px;width:100%;display:flex;align-items:flex-end;justify-content:center}
.bt i{display:block;width:min(100%,30px);height:var(--h);border-radius:8px 8px 6px 6px;background:linear-gradient(180deg,var(--sand),var(--sand-2));transition:background .15s}
.bcol.on .bt i{background:linear-gradient(180deg,#e4ea4a,#f4f9a6)}
.bchart.grey .bt i{background:linear-gradient(180deg,var(--grey-1),var(--grey-2))}
.bchart.grey .bcol.on .bt i{background:linear-gradient(180deg,#24282C,#3E4631)}
.bl{font-size:10.5px;color:var(--muted);white-space:nowrap}
.tip{display:none;position:absolute;bottom:calc(var(--h) + 8px);left:50%;transform:translateX(-50%);background:var(--dark-2);color:#fff;border-radius:8px;padding:4px 8px;font-size:11px;font-weight:600;white-space:nowrap;z-index:5}
.bcol:first-child .tip{left:0;transform:none}
.bcol:last-child .tip{left:auto;right:0;transform:none}
.bcol:hover .tip,.bcol.on .tip{display:block}
.bchart:hover .bcol.on:not(:hover) .tip{display:none}
.bcol{cursor:pointer}

/* quick payout and status card */
.qbox{border:1px solid var(--line);border-radius:16px;position:relative}
.qr{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;min-height:54px;font-size:14px}
.qr+.qr{border-top:1px solid var(--line)}
.qr .muted{white-space:nowrap}
a.qr:hover{background:#F8F8EE}
.qr select{min-height:40px;border:0;background:transparent;font:500 13.5px var(--f);width:58%;min-width:0;padding:6px 0;color:var(--ink)}
.qr input{border:0;outline:0;background:transparent;text-align:right;font:500 20px var(--f);width:38%;min-width:0;color:var(--ink)}
.qr .v{font-size:17px;font-weight:600;text-align:right;white-space:nowrap}
.swap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:40px;height:40px;border-radius:50%;background:#fff;border:1px solid var(--line);display:grid;place-items:center;z-index:2}
.swap:hover{background:var(--canvas)}
.qfoot{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);margin:10px 2px 14px;flex-wrap:wrap}

/* ---- controls ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 18px;height:44px;border-radius:14px;font-weight:600;font-size:14px;background:var(--dark);color:#fff;white-space:nowrap;border:1px solid var(--dark);transition:background .15s}
.btn:hover{background:#2f3625}
.btn.white{background:#fff;color:var(--ink);border-color:var(--line)}.btn.white:hover{background:#F8F8EE}
.btn.soft{background:#EDECE1;color:var(--ink);border-color:#EDECE1}.btn.soft:hover{background:#e2e1d3}
.btn.line{background:transparent;color:var(--ink);border-color:#cdd2bf}.btn.line:hover{background:#fff}
.btn.sm{height:34px;padding:0 12px;font-size:12.5px;border-radius:11px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.tabs{display:inline-flex;max-width:100%;flex-wrap:wrap;gap:2px;background:#E6E7D8;border-radius:14px;padding:4px}
.tabs button{padding:9px 14px;border-radius:10px;color:var(--muted);font-weight:600;font-size:13px;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs .on{background:var(--dark);color:#fff}
.search{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:0 16px;min-height:42px;flex:1;max-width:380px;min-width:180px;color:var(--muted)}
.search input{border:0;outline:0;background:transparent;width:100%;min-width:0;padding:10px 0;font:500 14px var(--f)}
.tag{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap;background:#fff;border:1px solid #d9ddca;color:var(--ink)}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:#b5b2ac}
.tag.mint::before{background:var(--ok)}.tag.sky::before{background:var(--info)}.tag.pink::before{background:var(--bad)}.tag.sun::before{background:var(--warn)}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:12px;color:#3E4631;flex:none}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who b{display:block;font-weight:600}
.who div{min-width:0}.who div span{display:block;font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}

table{border-collapse:collapse;width:100%;font-size:14px;color:inherit}
th{text-align:left;font-size:12px;color:var(--muted);padding:0 12px 10px;font-weight:500;white-space:nowrap}
td{padding:13px 12px;border-top:1px solid var(--line-2);vertical-align:middle;overflow-wrap:anywhere}
td.r,th.r{text-align:right}
tbody tr:hover{background:#F8F8EE}
tr.link{cursor:pointer}
td.act{text-align:right}
.list>*{padding:12px 0;border-top:1px solid var(--line-2);display:flex;align-items:center;gap:12px;min-width:0}
.list>*:first-child{border-top:0;padding-top:0}
.list .grow{flex:1;min-width:0}
.empty{padding:20px 0;color:var(--muted)}
.note{font-size:12.5px;color:var(--dn);margin-top:4px;font-weight:500}
.banner{background:var(--sand);color:#3E4631;border-radius:16px;padding:12px 16px;margin-bottom:16px;font-size:14px;font-weight:500}
.bar{margin:12px 0}.bar .t{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.bar .tr{height:12px;border-radius:7px;background:#EDECE1;margin-top:6px}.bar .fi{height:12px;border-radius:7px;background:linear-gradient(90deg,#C2CBAF,#3E4631)}

/* chat */
.chat{display:grid;grid-template-columns:290px minmax(0,1fr);background:#fff;border:1px solid var(--line);border-radius:22px;overflow:hidden;min-height:480px}
.convs{border-right:1px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:4px}
.conv{display:flex;gap:10px;align-items:center;padding:10px;border-radius:16px;text-align:left;width:100%}
.conv.on{background:var(--canvas)}.conv:hover{background:#F8F8EE}
.conv .t{flex:1;min-width:0}.conv .t b{display:flex;justify-content:space-between;gap:6px;font-weight:600}.conv .t span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted);font-size:13px}
.ub{background:var(--dark);color:#fff;border-radius:10px;min-width:20px;height:20px;font-size:11px;display:inline-grid;place-items:center;padding:0 6px}
.thread{display:flex;flex-direction:column;min-width:0}
.thead{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center}
.thead .back{display:none}
.msgs{flex:1;padding:16px 18px;display:flex;flex-direction:column;gap:10px;background:#F8F8EE;overflow-y:auto;height:360px}
.bub{max-width:min(78%,460px);padding:10px 14px;border-radius:18px;background:#EDECE1;overflow-wrap:anywhere}
.bub.me{align-self:flex-end;background:var(--dark);color:#fff;border-bottom-right-radius:6px}
.bub:not(.me){border-bottom-left-radius:6px}
.bub small{display:block;margin-top:4px;opacity:.65;font-size:11px;text-align:right}
.compose{display:flex;gap:10px;padding:12px 16px;border-top:1px solid var(--line)}
.compose input{flex:1;min-width:0;border:1px solid var(--line);border-radius:999px;padding:11px 18px;background:#fff;font-size:14px}
.chat.solo{grid-template-columns:minmax(0,1fr)}

/* modal, toast, forms */
.scrim{position:fixed;inset:0;background:rgba(36,40,44,.5);z-index:55;display:none}
.scrim.open{display:block}
.modalbg{position:fixed;inset:0;background:rgba(36,40,44,.5);z-index:80;display:none;place-items:center;padding:16px}
.modalbg.open{display:grid}
.modal{background:#fff;color:var(--ink);border-radius:26px;padding:24px;width:min(520px,100%);max-height:90vh;max-height:90dvh;overflow-y:auto}
.modal h2{font-size:22px;font-weight:600;letter-spacing:-.02em;margin-bottom:2px}
.fld{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.fld label{font-size:12.5px;font-weight:600;color:#4a4743}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);border-radius:14px;padding:11px 14px;background:#F8F8EE;width:100%;min-height:44px;font-size:14.5px}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--dark);background:#fff}
.fld input[readonly]{opacity:.8}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
.err{color:var(--dn);font-size:14px;font-weight:600;margin-top:12px}
.mact{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--dark-2);color:#fff;padding:12px 20px;border-radius:999px;z-index:120;display:none;max-width:calc(100vw - 32px);text-align:center;font-weight:500}
.toast.on{display:block}
.form{max-width:560px}

/* feedback board */
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--dark-2);color:#fff;border-radius:999px;padding:0 16px;min-height:46px;display:flex;gap:10px;align-items:center;font-weight:600;border:2px solid #fff}
.fab .n{background:var(--sand);color:#24282C;border-radius:10px;min-width:20px;height:20px;display:grid;place-items:center;font-size:11px;padding:0 6px;font-weight:700}
.fbp{position:fixed;top:0;right:0;bottom:0;width:min(400px,100vw);background:#fff;color:var(--ink);z-index:90;display:none;flex-direction:column;border-left:1px solid var(--line);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.fbp.open{display:flex}.fbp.hide{display:none}
.fbh{padding:18px 20px 10px;display:flex;align-items:center;gap:10px}
.fbh h2{font-size:22px;font-weight:600;flex:1;letter-spacing:-.02em}
.fbc{padding:0 20px 14px;border-bottom:1px solid var(--line)}
.kinds{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.kinds button{padding:8px 14px;border-radius:999px;background:var(--canvas);font-size:13px;font-weight:600;color:var(--muted)}
.kinds button.on{background:var(--dark);color:#fff}
.fbc textarea{width:100%;border:1px solid var(--line);background:#F8F8EE;border-radius:16px;padding:12px 14px;min-height:84px;resize:vertical;font-size:14px}
.fbc input[type=text]{border:1px solid var(--line);background:#F8F8EE;border-radius:999px;padding:10px 14px;min-width:0;flex:1;font-size:14px}
.fbl{flex:1;overflow-y:auto;padding:12px 20px 20px;display:flex;flex-direction:column;gap:10px}
.fi2{border:1px solid var(--line);border-radius:18px;padding:12px 14px;background:#F8F8EE}
.fi2.done{opacity:.55}
.fi2 .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:6px}
.fi2 p{white-space:pre-wrap;overflow-wrap:anywhere}
.fi2 .ac{display:flex;gap:12px;margin-top:8px;font-size:13px;font-weight:600;flex-wrap:wrap}
.fbn{font-size:13px;background:var(--sand-2);border-radius:14px;padding:8px 12px;margin:0 20px 8px;font-weight:500}
.pin{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50% 50% 50% 4px;background:var(--dark-2);color:#fff;font-weight:700;font-size:12px;display:grid;place-items:center;z-index:25;border:2px solid var(--sand);transform:rotate(-45deg)}
.pin span{transform:rotate(45deg)}
.pin.pend{background:#fff;color:var(--ink);border:2px dashed var(--ink)}
.pinmode #wrap{cursor:crosshair}
.pinbar{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:95;background:var(--dark-2);color:#fff;border-radius:999px;padding:8px 8px 8px 20px;display:none;gap:14px;align-items:center;font-weight:500;max-width:calc(100vw - 32px)}
.pinbar.on{display:flex}
.pinbar button{background:var(--sand);color:#24282C;border-radius:999px;padding:8px 14px;font-weight:700}
#wrap{position:relative}

  .pha .btn.sm{flex:1 1 140px}

/* feedback tab docked on the right edge: never covers buttons at the bottom, works on every screen */
.fab{right:0;left:auto;bottom:auto;top:50%;transform:translateY(-50%) translateX(6px);flex-direction:column;gap:10px;width:42px;min-height:0;padding:14px 0 12px;border-radius:16px 0 0 16px;border:0;border-left:3px solid var(--sand);background:var(--dark-2);color:#fff;justify-content:center;transition:transform .18s}
.fab:hover,.fab:focus-visible{transform:translateY(-50%) translateX(0)}
.fab .lbl{display:block;writing-mode:vertical-rl;transform:rotate(180deg);font-size:12.5px;letter-spacing:.04em;white-space:nowrap}
.fab .n{position:static;min-width:20px;height:20px;font-size:11px}
.fab svg{width:18px;height:18px}
body.authmode .fab{background:#fff;color:#14181a;border-left-color:#8a9680}
@media (max-width:560px){
  .fab{width:30px;padding:10px 0;transform:translateY(-50%) translateX(4px);bottom:auto;top:58%}
  .fab .lbl{display:none}.fab svg{width:16px;height:16px}
  .fab .n{min-width:18px;height:18px;font-size:10px}
}
/* logo sits directly on the page, no background shape */
.alogo,.al .alogo{background:none!important;padding:0!important;border-radius:0!important;border:0!important;margin:0 0 4px!important}
.alogo img{height:34px}

/* feedback hidden */
#fab,.fab,#fbp,.fbp{display:none!important}

.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px 20px}.kv>div{min-width:0}.kv span{display:block;font-size:12.5px;color:var(--muted);margin-bottom:3px}.kv b{font-weight:600;overflow-wrap:anywhere}.kv a{color:inherit;text-decoration:underline}
.kv .tag{display:inline-flex;width:auto}

.frhero{display:flex;align-items:center;justify-content:space-between;gap:18px;background:var(--dark);color:#fff}.frhero h2{color:#fff;font-size:22px;margin:4px 0 8px}.frhero p{color:#dfe5d2;margin:0;max-width:46ch}.frhero .eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--sand)}
.fsteps{list-style:none;margin:8px 0 0;padding:0}.fsteps li{display:flex;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--grey-2)}.fsteps li:first-child{border-top:0}.fsteps li>div:nth-child(2){flex:1;min-width:0}.fsteps p{margin:2px 0 0}
.fsteps .tick{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--sand-2);border:1px solid var(--grey-1);font-weight:600;font-size:13px}.fsteps .done .tick{background:var(--dark);color:#fff;border-color:var(--dark)}
@media (max-width:640px){.fsteps li{flex-wrap:wrap}.fsteps .facts{width:100%;padding-left:44px}.frhero{flex-direction:column-reverse;align-items:flex-start}}
.frhero .ring{width:68px;height:68px;font-size:15px;background:conic-gradient(var(--sand) calc(var(--p)*1%),rgba(255,255,255,.22) 0)}.frhero .ring::before{inset:5px;background:var(--dark)}.frhero .ring span{color:#fff}

.fsel select{min-height:40px;padding:0 34px 0 14px;border-radius:999px;border:1px solid var(--grey-1);background:#fff;color:var(--ink,#14181a);font:inherit;font-size:13.5px;cursor:pointer}
.more-row{display:flex;justify-content:center;padding:14px 0 4px}
.linkbtn{background:none;border:0;padding:0;color:inherit;text-decoration:underline;font:inherit;cursor:pointer;min-height:40px}
.errstate{max-width:560px}.errstate h2{margin-bottom:6px}
.notes{display:flex;flex-direction:column}.nrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--grey-2);padding:14px 4px;min-height:52px;font:inherit;color:inherit;cursor:pointer}.nrow:first-child{border-top:0}.nrow .dot{width:9px;height:9px;border-radius:50%;background:transparent;flex:none}.nrow.new .dot{background:#d9463b}.nrow.new .nt{font-weight:600}.nrow .nt{flex:1;min-width:0;overflow-wrap:anywhere}.nrow .go{color:var(--muted)}
.readby{display:flex;align-items:center;gap:12px;margin-top:12px;font-size:13px;color:var(--muted)}.readby b{color:inherit}.rbar{flex:none;width:80px;height:6px;border-radius:99px;background:var(--grey-2);overflow:hidden}.rbar i{display:block;height:100%;background:var(--dark)}.readby span{min-width:0;overflow-wrap:anywhere}
.cdel{display:inline-flex;align-items:center;min-height:40px}
.sthead{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}.sthead h2{margin:2px 0}.stmeta{display:grid;grid-template-columns:auto auto;gap:4px 12px;font-size:13px;align-content:start}.stmeta span{color:var(--muted)}.sthead .eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
@media print{#rail,#head,.scrim,.noprint,#mbg,#toast,.pha{display:none!important}body,.canvas,#wrap,#view{background:#fff!important}.canvas{margin:0!important;border-radius:0!important;padding:0!important}.card{border:0!important;box-shadow:none!important}.ptitle{display:none}.rt td,.rt th{font-size:12px}}
.av,.uav{overflow:hidden}.av img,.uav img{width:100%;height:100%;object-fit:cover;display:block}
.photo{display:flex;align-items:center;gap:16px;flex-wrap:wrap}.photo .av,.photo .ph{width:84px;height:84px;font-size:24px}
.photo .ph{border-radius:50%;overflow:hidden;display:grid;place-items:center;font-weight:600;color:#3E4631;flex:none}.photo .ph img{width:100%;height:100%;object-fit:cover}
.photo .acts{display:flex;gap:8px;flex-wrap:wrap}.photo input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.paybox{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:14px;background:var(--canvas)}
.pop .pall{display:block;text-align:center;font-weight:600;border-top:1px solid var(--grey-2);margin-top:6px;padding:12px 8px;min-height:44px}

</style>

}

function authShow(r){

  else if(r==='forgot')h=AS.sent?authCard('Check your email','If that address has an account, a reset link is on its way. It works once and expires in 1 hour.',toSignin):authCard('Forgot password','Enter your email and we will send a reset link.',`<form id="forgotform" novalidate>${field('Email address','email',{type:'email',ph:'you@example.com'})}<div class="err" id="aerr" role="alert"></div><button class="btn wide" type="submit" style="margin-top:16px">Send reset link</button></form>${toSignin}`);
  else if(r==='reset')h=AS.done?authCard('Password changed','You are signed in with your new password.',dash):authCard('Choose a new password','Pick something you do not use anywhere else.',`<form id="resetform" novalidate>${pw('New password','new')}${rulesHtml('')}${pw('Confirm new password','new2')}<div class="err" id="aerr" role="alert"></div><button class="btn wide" type="submit" style="margin-top:16px">Change password</button></form>`);
  else if(r==='suspended')h=authCard('Account suspended','Your Growth Partner account is paused, so you cannot sign in right now. Your records are safe and your earnings are not affected. Contact the studio to ask for a review.',toSignin);
  else if(r==='accept-invite-expired')h=authCard('This invitation is no longer valid','The link has expired or was already used. Invitation links work once and expire after 24 hours. Ask the studio to send you a new one.',toSignin);
  else{

  $('#auth').innerHTML=h;window.scrollTo(0,0);

const aerr=m=>{const e=$('#aerr');if(e)e.textContent=m};
async function startSession(){
  const {data:{user}}=await sb.auth.getUser();if(!user)return false;
  const {data:p,error}=await sb.from('profiles').select('*').eq('id',user.id).maybeSingle();
  if(error||!p){await sb.auth.signOut();toast('This account is not set up for the portal.');return false}
  if(p.status!=='active'){location.hash='suspended';await sb.auth.signOut();return false}
  ME=user.id;MEP=p;ROLE=p.role;
  try{await loadAll()}catch(e){toast(nice(e))}
  return true}
document.addEventListener('submit',async e=>{
  const id=e.target.id;if(!['signinform','forgotform','resetform','acceptform'].includes(id))return;e.preventDefault();
  const f=Object.fromEntries(new FormData(e.target)),btn=e.target.querySelector('button[type=submit]'),busy=v=>{if(btn)btn.disabled=v};
  if(id==='signinform'){const em=(f.email||'').trim().toLowerCase();
    if(!MAIL.test(em))return aerr('Enter a valid email address.');
    if(!(f.cur||''))return aerr('Enter your password.');
    busy(true);const {error}=await sb.auth.signInWithPassword({email:em,password:f.cur});
    if(error){busy(false);if(/banned/i.test(error.message)){location.hash='suspended';return}return aerr(/invalid login/i.test(error.message)?'That email and password do not match.':nice(error))}
    const ok=await startSession();busy(false);if(ok)location.hash=ROLE+'-dashboard';return}
  if(id==='forgotform'){const em=(f.email||'').trim().toLowerCase();if(!MAIL.test(em))return aerr('Enter a valid email address.');
    busy(true);await sb.auth.resetPasswordForEmail(em,{redirectTo:BASE});busy(false);AS.sent=true;authShow('forgot');return}
  if(id==='acceptform'&&(!(f.fn||'').trim()||!(f.ln||'').trim()))return aerr('Enter your first and last name.');
  const bad=pwRules(f.new||'').find(x=>!x[1]);
  if(bad)return aerr('Your password needs: '+bad[0].toLowerCase()+'.');
  if(f.new2!==undefined&&f.new!==f.new2)return aerr('The two passwords do not match.');
  if(id==='resetform'){busy(true);const {error}=await sb.auth.updateUser({password:f.new});busy(false);if(error)return aerr(nice(error));AS.done=true;authShow('reset');return}
  if(!f.terms)return aerr('Please agree to the terms to continue.');
  const full=((f.fn||'').trim()+' '+(f.ln||'').trim()).trim();busy(true);
  const {error}=await sb.auth.updateUser({password:f.new,data:{full_name:full}});
  if(error){busy(false);return aerr(nice(error))}
  await sb.from('profiles').update({full_name:full}).eq('id',ME);await reload();busy(false);
  AS.done=full.split(' ')[0];authShow('accept-invite')});

  if(bell){const pop=$('#pop');const open=pop.classList.toggle('open');if(!open){markNotesRead();render()}return}
  if(t.closest('#pop a')){markNotesRead()}
  if(!t.closest('#pop')){const pop=$('#pop');if(pop&&pop.classList.contains('open')){pop.classList.remove('open');markNotesRead();render()}}
  if(t.closest('#menubtn')){openRail();return}
  if(t.closest('#scrim')||t.closest('#railx'))return closeRail();
  if(t.closest('[data-qp]')){ACT.payout($('#qp-p').value,$('#qp-a').value);return}
  if(t.closest('[data-qpmax]')){const p=$('#qp-p').value;$('#qp-a').value=(avail(p)/100).toFixed(2);return}
  if(t.closest('[data-refresh]')){reload().then(()=>{toast('Up to date');render()});return}
  if(t.closest('[data-fl]')){S.fm=!S.fm;S.rm=null;render();return}
  const fv=t.closest('[data-flv]');if(fv){S.flt=fv.dataset.flv;S.fm=false;render();return}
  const rm=t.closest('[data-rm]');if(rm){S.rm=S.rm===rm.dataset.rm?null:rm.dataset.rm;S.fm=false;render();return}
  const bc=t.closest('[data-bar]');if(bc){const x=bc.dataset.bar.split(':');S.bar[x[0]]=Number(x[1]);render();return}
  const ch=t.closest('[data-chat]');if(ch){S.conv=ch.dataset.chat;if(location.hash==='#admin-messages'){S.open=true;render()}else{S.goChat=true;location.hash='admin-messages'}return}
  const a=t.closest('[data-act]');if(a&&ACT[a.dataset.act]){e.preventDefault();if(S.viewAs&&!VIEW_OK.has(a.dataset.act)){toast('Read-only while viewing as a partner.');return}ACT[a.dataset.act](a.dataset.id);return}
  const sg=t.closest('[data-sug]');if(sg){const i=$('#xin'),pos=i.selectionStart==null?i.value.length:i.selectionStart,bf=i.value.slice(0,pos).replace(/@([A-Za-z]*)$/,'@'+sg.dataset.sug+' ');i.value=bf+i.value.slice(pos);$('#sug').classList.remove('open');i.focus();i.setSelectionRange(bf.length,bf.length);return}
  const ct=t.closest('[data-ctab]');if(ct){S.ctab=ct.dataset.ctab;render();return}
  const tb=t.closest('[data-tab]');if(tb){S.tab=tb.dataset.tab;render();return}
  const cv=t.closest('[data-conv]');if(cv){S.conv=cv.dataset.conv;S.open=true;render();return}
  const h=t.closest('[data-href]');if(h&&!t.closest('a,button')){location.hash=h.dataset.href}
});
document.addEventListener('input',e=>{if(e.target.id!=='gs')return;const q=e.target.value.trim().toLowerCase(),b=$('#sres');if(!q){b.classList.remove('open');return}
  const res=sIndex().filter(x=>(x.t+' '+x.s).toLowerCase().includes(q)).slice(0,7);
  b.innerHTML=res.length?res.map(x=>`<a href="#${x.h}" role="option"><b>${esc(x.t)}</b><small>${esc(x.s)}</small></a>`).join(''):'<div class="empty pad">No matches</div>';b.classList.add('open')});
document.addEventListener('input',e=>{if(e.target.id!=='xin')return;const v=e.target.value.slice(0,e.target.selectionStart),m=v.match(/(?:^|\s)@([A-Za-z]*)$/),box=$('#sug');if(!m){box.classList.remove('open');return}const q=m[1].toLowerCase();
  const o=D.dir.filter(p=>p.role==='partner'&&p.id!==vid()).map(p=>({h:p.name.split(' ')[0],n:p.name,i:pIdx(p.id)})).concat(role()==='admin'?[{h:'everyone',n:'Everyone',i:3}]:[{h:'Studio',n:'Studio team',i:3}]).filter(x=>x.h.toLowerCase().startsWith(q));
  box.innerHTML=o.map(x=>`<button type="button" data-sug="${x.h}">${av(x.n,x.i)}<span><b>@${x.h}</b><small class="muted"> ${esc(x.n)}</small></span></button>`).join('');box.classList.toggle('open',o.length>0)});
document.addEventListener('change',e=>{if(S.viewAs&&e.target.id==='photo-in'){e.target.value='';toast('Read-only while viewing as a partner.');return}
  if(e.target.id==='photo-in'&&e.target.files&&e.target.files[0]){uploadPhoto(e.target.files[0]);e.target.value='';return}
  if(e.target.closest('#payform')&&e.target.name==='kind'){S.payKind=e.target.value;const y=scrollY;render();scrollTo(0,y);return}
  if(e.target.id==='qp-p'){const p=e.target.value;$('#qp-av').textContent=g(avail(p));$('#qp-hold').textContent='On hold '+g(held(p));$('#qp-a').value=''}});
document.addEventListener('input',e=>{const q=e.target.dataset&&e.target.dataset.q;if(q){S.q[q]=e.target.value;const pos=e.target.selectionStart;render();const n=document.querySelector(`[data-q="${q}"]`);if(n){n.focus();n.setSelectionRange(pos,pos)}}});
document.addEventListener('change',e=>{const k=e.target.dataset&&e.target.dataset.set;if(k==='hold'){fire(()=>q(sb.from('settings').update({hold_days:Number(e.target.value)}).eq('id',1)),'Setting saved')}});
document.addEventListener('submit',e=>{
  if(e.target.id==='xform'){e.preventDefault();const v=$('#xin').value.trim();if(!v)return;$('#xin').value='';fire(()=>q(sb.from('community_messages').insert({body:v}))).then(()=>{const x=$('#xin');x&&x.focus()});return}
  if(e.target.id==='cform'){e.preventDefault();const v=$('#cin').value.trim();if(!v)return;const cid=role()==='admin'?S.conv:ME;if(!cid)return;$('#cin').value='';fire(()=>q(sb.from('messages').insert({partner_id:cid,body:v}))).then(()=>{$('#cin')&&$('#cin').focus()});return}
  if(e.target.id==='pform'){e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),er=t=>{$('#perr').textContent=t};
    const ph=(f.phone||'').trim(),digits=ph.replace(/[\s\-().]/g,'');
    if(!ph)return er('Enter your phone number.');
    if(!/^\+?\d{9,15}$/.test(digits))return er('Enter a phone number using digits only, like 024 123 4567 or +233 24 123 4567.');
    if(!(f.city||'').trim())return er('Enter your city or town.');
    fire(()=>q(sb.from('profiles').update({phone:ph,city:f.city.trim()}).eq('id',ME)),'Details saved')}
  if(e.target.id==='payform'){e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),er=t=>{$('#payerr').textContent=t};
    let n=(f.acct||'').replace(/[\s\-]/g,''),n2=(f.acct2||'').replace(/[\s\-]/g,'');
    if(f.kind==='momo'&&/^\+?233\d{9}$/.test(n))n='0'+n.replace(/^\+?233/,'');if(f.kind==='momo'&&/^\+?233\d{9}$/.test(n2))n2='0'+n2.replace(/^\+?233/,'');
    if(!(f.provider||'').trim())return er(f.kind==='momo'?'Choose your Mobile Money network.':'Enter your bank.');
    if(!/^\d+$/.test(n))return er('Enter the number using digits only.');
    if(f.kind==='momo'&&!/^0\d{9}$/.test(n))return er('A Mobile Money number has 10 digits, like 024 123 4567.');
    if(f.kind==='bank'&&!/^\d{6,20}$/.test(n))return er('Enter the full account number (6 to 20 digits).');
    if(n!==n2)return er('The two numbers do not match. Check them and type them again.');
    if((f.aname||'').trim().length<2)return er('Enter the name on the account.');
    const row={kind:f.kind,provider:f.provider.trim(),account_number:n,account_name:f.aname.trim(),branch:f.kind==='bank'?(f.branch||'').trim()||null:null};
    fire(()=>D.pay[ME]?q(sb.from('payout_accounts').update(row).eq('partner_id',ME)):q(sb.from('payout_accounts').insert(Object.assign({partner_id:ME},row))),'Payout details saved. The studio has been told.')}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeModal();closeFb();closeRail();const s=$('#sres');s&&s.classList.remove('open');if(S.rm||S.fm){S.rm=null;S.fm=false;render()}return}
  const tn=(document.activeElement||{}).tagName||'';
  if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(tn)&&!$('#mbg').classList.contains('open')){const gi=$('#gs');if(gi){e.preventDefault();gi.focus()}}
  if(e.key==='Enter'&&e.target.id==='gs'){const f=document.querySelector('#sres a');if(f){e.preventDefault();location.hash=f.getAttribute('href').slice(1);$('#sres').classList.remove('open');e.target.value=''}}
});

async function boot(){
  document.body.classList.add('authmode');
  $('#auth').innerHTML='<div class="aw"><section class="ar" style="grid-column:1/-1"><div class="acard"><p class="muted">Loading the portal…</p></div></section></div>';
  const lt=(/[#&]type=([a-z]+)/.exec(BOOT_HASH)||[])[1],le=/[#&]error(_code)?=/.test(BOOT_HASH);
  let sess=null;try{sess=(await sb.auth.getSession()).data.session}catch(_){}
  BOOTED=true;S.open=false;
  if(sess&&await startSession()){if(lt==='invite')location.replace('#accept-invite');else if(lt==='recovery')location.replace('#reset')}
  else if(le)location.replace('#'+(lt==='recovery'?'forgot':'accept-invite-expired'));
  render();
}
boot();
})();
